<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Locatário - Altis+ Biblioteca</title>

    <link rel="stylesheet" href="../../telas-admin/css/global.css">
    <link rel="stylesheet" href="../../telas-admin/css/sidebar.css">
    <link rel="stylesheet" href="../../telas-admin/css/header.css">
    <link rel="stylesheet" href="../../telas-admin/css/profile-menu/profile-menu.css">
    
    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body data-tipo-usuario="tenant">

    <div class="container">

        <!-- Sidebar global -->
        <aside class="sidebar">
            <div class="logo"></div>

            <nav>

                <a href="dashboard.html" class="ativo">
                    <i class="fa-solid fa-chart-column"></i>
                    Dashboard
                </a>

            </nav>

            <span class="admin">Ana Fernandes</span>

        </aside>


        <div class="content">

            <!-- Header -->
            <header>

                <div class="titulo">
                    <h1>Olá Ana</h1>
                    <p>Seu painel de leitura</p>
                </div>

                <div class="perfil">

                    <div class="avatar">
                        AF
                    </div>

                    <span>Ana Fernandes</span>

                </div>

            </header>


            <!-- Conteúdo -->
            <main class="tenantDashboard">

                <!-- Cards -->
                <section class="cardsTenant">

                    <div class="cardTenant">
                        <span class="alugados"></span>

                        <p>Alugados</p>

                        <h2 id="totalAlugados">
                            3
                        </h2>
                    </div>


                    <div class="cardTenant cardLivro">
                        <p>Último livro alugado</p>

                        <strong id="ultimoLivro">
                            Dom Casmurro
                        </strong>
                    </div>


                    <div class="cardTenant cardLivroMais">
                        <p>Livro mais alugado</p>

                        <div class="livroDestaque">
                            <i class="fa-solid fa-star"></i>

                            <strong id="livroMaisAlugado">
                                1984 - George Orwell
                            </strong>
                        </div>
                    </div>
                </section>

                <!-- Meus aluguéis -->
                <section class="painelAlugueis">
                    
                    <div class="cabecalhoTabela">
                        <span>Meus aluguéis</span>
                        <span>Aluguel</span>
                        <span>Devolução</span>
                        <span>Status</span>
                    </div>

                    <div id="listaAlugueis"></div>
                </section>
            </main>

        </div>

    </div>

    <script src="dashboard.js"></script>
    <script src="../../telas-admin/css/profile-menu/profile-menu.js"></script>

</body>

</html>
