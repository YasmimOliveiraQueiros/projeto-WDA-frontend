<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login - Altis Biblioteca</title>
</head>
<body>

    <div class="container">
        <div class="left-side">
            <div class="logo-badge">
                <img src="../../assets/icons/logo-book.svg" alt="Altis+ Biblioteca" class="logo-icon">
            </div>
            <h2>Altis+ Biblioteca</h2>
            <p>Sistema de gestão de aluguéis</p>
        </div> 
    
        <div class="right-side">
            <div class="header-text">
                <h2>Bem-vindo de volta!</h2>
                <p>Faça login para acessar o sistema</p>
            </div>

            <img src="../../assets/icons/login/user.svg" alt="Ícone de usuário" class="icon-user">

            <form> 
                
                <label>E-mail</label>
                <div class="input-wrapper">
                    <input type="email" placeholder="seuemail@email.com" id="email">
                </div>

                <label>Senha</label>
                <div class="input-wrapper">
                    <input type="password" placeholder="********" id="senha">
                     <img src="../../assets/icons/eye-slash.svg" alt="Mostrar senha" class="icon" id="toggleSenha">
                </div>

                <button type="submit">Entrar</button>

                <p id="mensagemErro" class="mensagem-erro"></p>
                
                <div class="links">
                    <a href="../forgot-password/forgot-password.html">Recuperar senha?</a>
                    <a href="../register/register.html">Realizar cadastro?</a>
                </div>

            </form>
        </div>
    
    
    
    </div>

    <script src="login.js"></script>
</body>
</html>
