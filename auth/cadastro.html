<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Altis Biblioteca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

<div class="container">

    <div class="left-side">
        <h2>Altis+ Biblioteca</h2>
        <p>Sistema de gestão de aluguéis</p>
    </div>

    <div class="right-side">

        <div class="header-text">
            <h2>Cadastrar nova conta</h2>
        </div>

        <p id="mensagemErro" class="mensagem-erro"></p>

        <form id="formCadastro" action="login.html">

            <label for="nome">Nome completo</label>
            <div class="input-wrapper">
                <input type="text" id="nome" placeholder="Seu nome">
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <label for="data">Data de nascimento</label>
                    <input type="date" id="data">
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <div class="input-wrapper">
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>
                </div>
            </div>

            <label for="telefone">Telefone</label>
            <div class="input-wrapper">
                <input type="tel" id="telefone" placeholder="(85) 99999-9999">
            </div>

            <label>Endereço</label>
            <div class="endereco">
                <div class="campo">
                    <label for="casa">Casa</label>
                    <input type="text" id="casa" placeholder="Rua 22">
                </div>
                <div class="campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="120A">
                </div>
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Maracanaú">
                </div>
            </div>

            <label for="email">E-mail</label>
            <div class="input-wrapper">
                <input type="email" id="email" placeholder="seuemail@email.com">
            </div>

            <label for="senha">Senha</label>
            <div class="input-wrapper">
                <input type="password" id="senha" placeholder="********">
                <i class="fa-solid fa-eye-slash" id="toggleSenha"></i>
            </div>

            <label for="confirmarSenha">Confirmar senha</label>
            <div class="input-wrapper">
                <input type="password" id="confirmarSenha" placeholder="********">
                <i class="fa-solid fa-eye-slash" id="toggleConfirmarSenha"></i>
            </div>

            <button type="submit">Cadastrar</button>

            <button
                type="button"
                class="voltar"
                onclick="window.location.href='login.html'">
                Voltar ao Login
            </button>

        </form>

    </div>

</div>

<script src="cadastro.js"></script>

</body>
</html>
