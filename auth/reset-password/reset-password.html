<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="reset-password.css">
    <title>Redefinir Senha - Altis Biblioteca</title>
</head>
<body>

    <div class="container">

        <div class="left-side">
            <h2>Altis+ Biblioteca</h2>
            <p>Sistema de gestão de aluguéis</p>
        </div>

        <div class="right-side">

            <div class="header-text">
                <h2>Recuperar senha</h2>
            </div>

            <p id="mensagemErro" class="mensagem-erro"></p>

            <form action="../login/login.html">

                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="seuemail@email.com">
                </div>

                <label for="cpf">CPF</label>
                <div class="input-wrapper">
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="senha" placeholder="********">
                    <i class="fa-solid fa-eye-slash" id="toggleSenha"></i>
                </div>

                <label for="confirmarSenha">Confirmar senha</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmarSenha" placeholder="********">
                    <i class="fa-solid fa-eye-slash" id="toggleConfirmarSenha"></i>
                </div>

                <button type="submit">Confirmar</button>

                <button 
                type="button"
                class="voltar"
                onclick="window.location.href='../forgot-password/forgot-password.html'">
                Voltar
                </button>

            </form>

        </div>

    </div>

    <script src="reset-password.js"></script>

</body>
</html>
