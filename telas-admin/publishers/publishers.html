<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editoras - Altis+ Biblioteca</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="publishers.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">

            <div class="logo"></div>

            <nav>
                <a href="../dashboard/dashboard.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Dashboard
                </a>

                <a href="../loans/loans.html">
                    <i class="fa-solid fa-book-open-reader"></i>
                    Aluguéis
                </a>

                <a href="../books/books.html">
                    <i class="fa-solid fa-book"></i>
                    Livros
                </a>

                <a href="publishers.html" class="ativo">
                    <i class="fa-solid fa-building"></i>
                    Editoras
                </a>

                <a href="../users/users.html">
                    <i class="fa-solid fa-users"></i>
                    Usuários
                </a>
            </nav>

            <span class="admin">Admin</span>

        </div>

        <div class="content">

            <header>
                <div>
                    <h1>Altis+ Biblioteca</h1>
                    <p>Controle de editoras</p>
                </div>

                <div class="perfil">

                    <div class="avatar">
                        LF
                    </div>

                    <span>Levy Fernandes</span>

                </div>
            </header>


            <main>

                <div class="topo">

                    <div class="cards">

                        <div class="card">
                            <p>
                                <span class="editoras"></span>
                                Editoras
                            </p>
                            <h2 id="totalEditoras">0</h2>
                        </div>


                        <div class="card">
                            <p>
                                <span class="livros"></span>
                                Livros vinculados
                            </p>
                            <h2 id="totalLivros">0</h2>
                        </div>
                    </div>

                    <button class="btnNova">
                        + Nova editora
                    </button>
                </div>


                <div class="pesquisa">
                    <input
                        type="text"
                        id="campoBusca"
                        placeholder="Buscar por nome ou e-mail">
                </div>


                <div class="tabela">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Livros cadastrados</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>

                        <tbody id="listaEditoras"></tbody>

                    </table>
                </div>
            </main>


            <!-- Modal de edição -->
            <div class="modal" id="modalEditora">

                <div class="modalConteudo">

                    <div class="modalCabecalho">

                        <h2>Editar editora</h2>

                        <button
                            type="button"
                            class="fecharModal"
                            id="fecharModalEditora">

                            &times;
                        </button>

                    </div>

                    <form id="formEditora">

                        <label for="nomeEditora">
                            Nome da editora
                        </label>

                        <input
                            type="text"
                            id="nomeEditora"
                            required>


                        <label for="cnpjEditora">
                            CNPJ
                        </label>

                        <input
                            type="text"
                            id="cnpjEditora"
                            placeholder="00.000.000/0000-00"
                            required>


                        <label for="cidadeEditora">
                            Cidade - UF
                        </label>

                        <input
                            type="text"
                            id="cidadeEditora"
                            placeholder="São Paulo - SP"
                            required>


                        <label for="exemplaresEditora">
                            Quantidade de exemplares
                        </label>

                        <input
                            type="number"
                            id="exemplaresEditora"
                            min="0"
                            required>


                        <label for="emailEditora">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="emailEditora"
                            placeholder="contato@editora.com"
                            required>


                        <label for="statusEditora">
                            Status
                        </label>

                        <select id="statusEditora">
                            <option value="ativa">
                                Ativa
                            </option>

                            <option value="inativa">
                                Inativa
                            </option>
                        </select>

                        <div class="modalAcoes">

                            <button
                                type="button"
                                class="btnCancelar"
                                id="cancelarEditora">
                                Cancelar
                            </button>

                            <button
                                type="submit"
                                class="btnSalvar">
                                Salvar
                            </button>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="publishers.js"></script>

</body>

</html>
