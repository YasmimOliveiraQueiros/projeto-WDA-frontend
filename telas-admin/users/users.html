<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Altis+ Biblioteca</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/profile-menu/profile-menu.css">
    <link rel="stylesheet" href="users.css">
</head>

<body data-tipo-usuario="admin">

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <img src="../../../assets/icons/logo-book.svg" alt="Altis+ Biblioteca" class="logo-icon">
            </div>

            <nav>
                <a href="../dashboard/dashboard.html">
                    <img src="../../../assets/icons/dashboard.svg" alt="Dashboard" class="icon-nav">
                    Dashboard
                </a>

                <a href="../loans/loans.html">
                    <img src="../../../assets/icons/loans.svg" alt="Aluguéis" class="icon-nav">
                    Aluguéis
                </a>

                <a href="../books/books.html">
                    <img src="../../../assets/icons/books.svg" alt="Livros" class="icon-nav">
                    Livros
                </a>

                <a href="../publishers/publishers.html">
                    <img src="../../../assets/icons/publishers.svg" alt="Editoras" class="icon-nav">
                    Editoras
                </a>

                <a href="../users/users.html" class="ativo">
                    <img src="../../../assets/icons/users.svg" alt="Usuários" class="icon-nav">
                    Usuários
                </a>
            </nav>

            </nav>

            <span class="admin">Admin</span>

        </aside>


        <main class="content">

            <header>

                <div class="titulo">
                    <h1>Altis+ Biblioteca</h1>
                    <p>Controle de usuários</p>
                </div>

                <div class="perfil">

                    <div class="avatar">
                        LF
                    </div>

                    <span>Levy Fernandes</span>

                </div>

            </header>


            <section class="topo">

                <div class="cards">

                    <div class="card">
                        <span class="ativo"></span>
                        <p>Ativos</p>
                        <h2 id="totalAtivos">0</h2>
                    </div>

                    <div class="card">
                        <span class="inativo"></span>
                        <p>Inativos</p>
                        <h2 id="totalInativos">0</h2>
                    </div>

                    <div class="card">
                        <span class="total"></span>
                        <p>Total</p>
                        <h2 id="totalUsuarios">0</h2>
                    </div>

                </div>

            </section>

            <section class="pesquisa">

                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Buscar por nome ou email">

                <select id="filtroStatus">
                    <option value="todos">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>

            </section>

            <section class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Livros alugados</th>
                            <th>Status</th>
                            <th>Ação</th>    
                        </tr>
                    </thead>

                    <tbody id="listaUsuarios"></tbody>

                </table>

        </main>
    </div>

    <script src="users.js"></script>
    <script src="../css/profile-menu/js/i18.js"></script>
    <script src="../css/profile-menu/profile-menu.js"></script>

</body>

</html>
