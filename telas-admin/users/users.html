<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários - Altis+ Biblioteca</title>

    <link rel="stylesheet" href="users.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <!-- Logo será adicionada futuramente -->
            </div>

            <nav>

                <a href="../dashboard/dashboard.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Dashboard
                </a>


                <!-- Página adicionada fururamente -->
                <a href="../loans/loans.html">
                    <i class="fa-solid fa-book-open-reader"></i>
                    Aluguéis
                </a>
                
                <!-- Página adicionada fururamente -->
                <a href="../books/books.html">
                    <i class="fa-solid fa-book"></i>
                    Livros
                </a>

                <!-- Página adicionada fururamente -->
                <a href="../publishers/publishers.html">
                    <i class="fa-solid fa-building"></i>
                    Editoras
                </a>

                <a href="../users/users.html" class="ativo">
                    <i class="fa-solid fa-users"></i>
                    Usuários
                </a>

            </nav>

            <span class="admin">Admin</span>

        </aside>


        <main class="content">

            <header>

                <div class="titulo">
                    <h1>Altis+ Biblioteca</h1>
                    <p>Controle de usuários</p>
                </div>

                <div class="perfil">

                    <div class="avatar">
                        LF
                    </div>

                    <span>Levy Fernandes</span>

                </div>

            </header>


            <section class="topo">

                <div class="cards">

                    <div class="card">
                        <span class="ativo"></span>
                        <p>Ativos</p>
                        <h2 id="totalAtivos">0</h2>
                    </div>

                    <div class="card">
                        <span class="inativo"></span>
                        <p>Inativos</p>
                        <h2 id="totalInativos">0</h2>
                    </div>

                    <div class="card">
                        <span class="total"></span>
                        <p>Total</p>
                        <h2 id="totalUsuarios">0</h2>
                    </div>

                </div>

            </section>

            <section class="pesquisa">

                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Buscar por nome ou email">

                <select id="filtroStatus">
                    <option value="todos">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>

            </section>

            <section class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Livros alugados</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="listaUsuarios"></tbody>

                </table>

        </main>
    </div>

    <script src="users.js"></script>

</body>

</html>
